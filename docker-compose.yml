name: ai-interview-platform

services:
  api:
    build:
      context: .
      # The dev stage carries ruff and runs uvicorn with --reload.
      # Production parity: docker build --target runtime .
      target: dev
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Source is mounted so edits reload without rebuilding the image.
      - ./app:/app/app
      # Mounted so that a revision autogenerated inside the container lands in
      # the repository on the host, not only in the container filesystem.
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # The test suite is not part of the image: it is mounted, so it never
      # ships to production and never invalidates the application layer.
      - ./tests:/app/tests
      # make lint and make fmt run ruff inside this container, so its
      # configuration has to be the file on the host, not the one baked into the
      # image at build time.
      - ./pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    # Local development credentials ONLY. They are intentionally weak and must
    # never be reused outside this compose file.
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      # Exposed so psql or a GUI client can inspect the database from the host.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # No volume on purpose: Redis is a cache and transient state here, never a
    # source of truth, so losing its contents must be survivable.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
