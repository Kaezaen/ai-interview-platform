[project]
name = "ai-interview-platform"
version = "0.1.0"
description = "AI-powered interview preparation and evaluation platform"
requires-python = ">=3.12,<3.13"

# Runtime dependencies are kept deliberately lean. Redis and AI SDK dependencies
# are added on the day they are actually used, not up front.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    # EmailStr validation lives in a separate package.
    "pydantic[email]>=2.9.0",
    # The asyncio extra pulls in greenlet, which the async engine needs.
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # JWT encode/decode. PyJWT is minimal and actively maintained; python-jose
    # drags in crypto backends this project never uses.
    "pyjwt>=2.10.0",
    # Argon2id: no 72-byte input limit, unlike bcrypt. Used directly rather than
    # through passlib, which is unmaintained and breaks against bcrypt 4.x.
    "argon2-cffi>=23.1.0",
    # The unified Google Gen AI SDK. The older google-generativeai package is out
    # of support and no longer receives security fixes; this one has the async
    # client and the response-schema mode the provider needs.
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    # anyio would also work, but pytest-asyncio's auto mode keeps the test files
    # free of a decorator on every single coroutine.
    "pytest-asyncio>=0.24.0",
    # ASGITransport drives the application in-process: the tests exercise the
    # real routing, dependencies and exception handlers without a live server.
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project root is not a package, so pytest would otherwise only put tests/
# on sys.path and "import app" would fail inside the container.
pythonpath = ["."]
# Every endpoint test here is a coroutine; marking each one individually adds
# noise, and an omitted marker fails in a confusing way.
asyncio_mode = "auto"
# One event loop for the whole run. The connection pool is opened once by a
# session fixture, and asyncpg connections cannot be shared across loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.uv]
# This is an application, not a distributable library: there is nothing to build
# or install as a package, only dependencies to resolve.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# The project root is a source root too, so that "app" is recognised as a
# first-party package from files outside it, such as alembic/env.py.
src = [".", "app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
# The migrations directory is named "alembic", which would otherwise make the
# alembic library itself look like a first-party package.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
