[project]
name = "ai-interview-platform"
version = "0.1.0"
description = "AI-powered interview preparation and evaluation platform"
requires-python = ">=3.12,<3.13"

# Runtime dependencies are kept deliberately lean. Database, Redis, and AI SDK
# dependencies are added on the day they are actually used, not up front.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.uv]
# This is an application, not a distributable library: there is nothing to build
# or install as a package, only dependencies to resolve.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
