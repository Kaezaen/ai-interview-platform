# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: env.py reads DATABASE_URL from the
# application settings, so there is exactly one source of configuration and no
# database credentials in a tracked file.

[alembic]
script_location = alembic

# Lets "alembic" find the app package when run from the project root.
prepend_sys_path = .

# Revision files sort chronologically by name, which makes the migration history
# readable in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
